name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Publish only the files the site needs, not the whole repo.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html telemetry.js analytics.js machine.js app.js print.js wallpapers.js gallery.js feedback.js style.css sample-image.jpeg og-image.jpg _site/
          cp -r samples _site/

      # Pages lets browsers cache files for 10 minutes; versioning the asset
      # URLs stops new HTML from loading a stale stylesheet or script.
      - name: Version asset URLs
        run: |
          sed -i -E "s/(href=\"[^\"]+\.css|src=\"[^\"]+\.js)\"/\1?v=${GITHUB_SHA::8}\"/g" _site/index.html
          grep -E "\.(css|js)\?v=" _site/index.html

      # Tells Sentry which commit each error or replay came from.
      - name: Stamp release for telemetry
        run: |
          sed -i -E "s/<script src=\"telemetry\.js/<script data-release=\"${GITHUB_SHA}\" src=\"telemetry.js/" _site/index.html
          grep -E "data-release=\"[0-9a-f]{40}\" src=\"telemetry\.js" _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
