name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish only the files the site needs, not the whole repo.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html app.js print.js gallery.js style.css sample-image.jpeg _site/
          cp -r samples _site/

      # Pages lets browsers cache files for 10 minutes; versioning the asset
      # URLs stops new HTML from loading a stale stylesheet or script.
      - name: Version asset URLs
        run: |
          sed -i -E "s/(href=\"[^\"]+\.css|src=\"[^\"]+\.js)\"/\1?v=${GITHUB_SHA::8}\"/g" _site/index.html
          grep -E "\.(css|js)\?v=" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
