name: Prints worker

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the worker
        run: node --test "worker/test/*.test.js"

  deploy:
    needs: test
    # Only from master, and skipped until the Cloudflare account is set up:
    # add the CLOUDFLARE_ACCOUNT_ID variable and CLOUDFLARE_API_TOKEN secret
    # (see worker/README.md).
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: prints-worker
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker
        run: npx --yes wrangler@4.151.0 deploy
